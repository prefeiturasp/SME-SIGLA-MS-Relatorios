repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        exclude: ^apps/.*/migrations/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy apps
        language: system
        types: [python]
        pass_filenames: false
        exclude: ^(docs/|.*/migrations/)
